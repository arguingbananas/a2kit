<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44525f"/>
    </marker>
    <style>
      .tb { font-size: 15px; fill: #1c2630; font-weight: bold; }
      .h  { font-size: 17px; font-weight: bold; fill: #ffffff; }
      .s  { font-size: 12.5px; fill: #44525f; }
      .m  { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #1c2630; }
      .box { stroke-width: 1.6; }
      .a  { stroke: #44525f; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1c2630">a2kit workflow: from a file on your computer to the Apple II</text>

  <rect x="20"  y="56" width="150" height="34" rx="6" fill="#5b6b7a"/><text x="95"  y="79" text-anchor="middle" class="h">1  Your assets</text>
  <rect x="205" y="56" width="190" height="34" rx="6" fill="#2f6fb0"/><text x="300" y="79" text-anchor="middle" class="h">2  Convert</text>
  <rect x="430" y="56" width="200" height="34" rx="6" fill="#2e8b57"/><text x="530" y="79" text-anchor="middle" class="h">3  Send</text>
  <rect x="665" y="56" width="50"  height="34" rx="6" fill="#2e8b57"/><text x="690" y="79" text-anchor="middle" class="h">4</text>
  <rect x="765" y="56" width="215" height="34" rx="6" fill="#b5651d"/><text x="872" y="79" text-anchor="middle" class="h">5  Apple II</text>

  <rect class="box" x="20" y="110" width="150" height="74" rx="8" fill="#eef1f4" stroke="#5b6b7a"/>
  <text x="95" y="140" text-anchor="middle" class="tb">Pictures</text>
  <text x="95" y="162" text-anchor="middle" class="s">PNG, JPG</text>
  <rect class="box" x="205" y="110" width="190" height="74" rx="8" fill="#e6f0fa" stroke="#2f6fb0"/>
  <text x="300" y="140" text-anchor="middle" class="m">./a2kit image</text>
  <text x="300" y="162" text-anchor="middle" class="s">dither to 280x192, 1-bit</text>
  <rect class="box" x="430" y="110" width="200" height="74" rx="8" fill="#e8f5ed" stroke="#2e8b57"/>
  <text x="530" y="140" text-anchor="middle" class="m">./a2kit send</text>
  <text x="530" y="162" text-anchor="middle" class="s">one picture or block</text>
  <path class="a" d="M632,147 L663,147"/>
  <path class="a" d="M172,147 L203,147"/>
  <path class="a" d="M397,147 L428,147"/>
  <rect class="box" x="20" y="208" width="150" height="74" rx="8" fill="#eef1f4" stroke="#5b6b7a"/>
  <text x="95" y="238" text-anchor="middle" class="tb">Animation</text>
  <text x="95" y="260" text-anchor="middle" class="s">GIF, frames, video*</text>
  <rect class="box" x="205" y="208" width="190" height="74" rx="8" fill="#e6f0fa" stroke="#2f6fb0"/>
  <text x="300" y="238" text-anchor="middle" class="m">./a2kit video</text>
  <text x="300" y="260" text-anchor="middle" class="s">sends only what changed</text>
  <rect class="box" x="430" y="208" width="200" height="74" rx="8" fill="#e8f5ed" stroke="#2e8b57"/>
  <text x="530" y="238" text-anchor="middle" class="m">./a2kit stream</text>
  <text x="530" y="260" text-anchor="middle" class="s">play a video</text>
  <path class="a" d="M632,245 L663,245"/>
  <path class="a" d="M172,245 L203,245"/>
  <path class="a" d="M397,245 L428,245"/>
  <rect class="box" x="20" y="306" width="150" height="74" rx="8" fill="#eef1f4" stroke="#5b6b7a"/>
  <text x="95" y="336" text-anchor="middle" class="tb">Sound</text>
  <text x="95" y="358" text-anchor="middle" class="s">WAV, 8 or 16 bit</text>
  <rect class="box" x="205" y="306" width="190" height="74" rx="8" fill="#e6f0fa" stroke="#2f6fb0"/>
  <text x="300" y="336" text-anchor="middle" class="m">./a2kit audio</text>
  <text x="300" y="358" text-anchor="middle" class="s">4-bit clicks for the speaker</text>
  <rect class="box" x="430" y="306" width="200" height="74" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-dasharray="6 4"/>
  <text x="530" y="336" text-anchor="middle" class="s">(no command of its own)</text>
  <text x="530" y="356" text-anchor="middle" class="s">sound rides inside a show</text>
  <text x="530" y="372" text-anchor="middle" class="s">or a video (--audio)</text>
  <path class="a" d="M172,343 L203,343"/>
  <path class="a" d="M397,343 L428,343"/>
  <rect class="box" x="20" y="404" width="150" height="74" rx="8" fill="#eef1f4" stroke="#5b6b7a"/>
  <text x="95" y="434" text-anchor="middle" class="tb">Show script</text>
  <text x="95" y="456" text-anchor="middle" class="s">show.toml</text>
  <rect class="box" x="205" y="404" width="190" height="74" rx="8" fill="#e6f0fa" stroke="#2f6fb0"/>
  <text x="300" y="434" text-anchor="middle" class="m">./a2kit show plan</text>
  <text x="300" y="456" text-anchor="middle" class="s">converts everything, lists upload</text>
  <rect class="box" x="430" y="404" width="200" height="74" rx="8" fill="#e8f5ed" stroke="#2e8b57"/>
  <text x="530" y="434" text-anchor="middle" class="m">./a2kit show send</text>
  <text x="530" y="456" text-anchor="middle" class="s">images + sound, in order</text>
  <path class="a" d="M632,441 L663,441"/>
  <path class="a" d="M172,441 L203,441"/>
  <path class="a" d="M397,441 L428,441"/>

  <!-- serial cable bar -->
  <rect class="box" x="665" y="110" width="50" height="368" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-dasharray="6 4"/>
  <text transform="translate(707,294) rotate(-90)" text-anchor="middle" class="tb">RS-232 serial cable</text>
  <text transform="translate(689,294) rotate(-90)" text-anchor="middle" class="s">built-in port or USB adapter · 19200 8N1</text>
  <path class="a" d="M717,225 L763,225"/>

  <!-- Apple II -->
  <rect class="box" x="765" y="110" width="215" height="230" rx="8" fill="#fbf0e4" stroke="#b5651d"/>
  <text x="872" y="138" text-anchor="middle" class="tb">Super Serial Card, slot 2</text>
  <text x="872" y="186" text-anchor="middle" class="m">Receiver</text>
  <text x="872" y="205" text-anchor="middle" class="s">from the boot disk, or typed in</text>
  <text x="872" y="248" text-anchor="middle" class="m">Sequencer / Video player</text>
  <text x="872" y="267" text-anchor="middle" class="s">uploaded for you by --install</text>
  <text x="872" y="300" text-anchor="middle" class="s">uploads: checksummed packets,</text>
  <text x="872" y="318" text-anchor="middle" class="s">each ACKed; video: one-way</text>
  <rect class="box" x="765" y="370" width="100" height="108" rx="8" fill="#ffffff" stroke="#b5651d"/>
  <text x="815" y="414" text-anchor="middle" class="tb">Screen</text><text x="815" y="436" text-anchor="middle" class="s">HGR page 1 / 2</text>
  <rect class="box" x="880" y="370" width="100" height="108" rx="8" fill="#ffffff" stroke="#b5651d"/>
  <text x="930" y="414" text-anchor="middle" class="tb">Speaker</text><text x="930" y="436" text-anchor="middle" class="s">4-bit audio</text>
  <path class="a" d="M815,342 L815,368"/>
  <path class="a" d="M930,342 L930,368"/>

  <text x="20" y="504" class="s">Files: .a2b = image or audio block  ·  .a2v = video stream  ·  show.toml = your script  ·  * video files need ffmpeg on your computer</text>

  <rect x="20" y="520" width="960" height="62" rx="8" fill="#fff8dc" stroke="#c9a400" stroke-width="1.6"/>
  <text x="36" y="546" class="tb">Once per power-up</text>
  <text x="36" y="568" class="m">Boot a2kit-boot.dsk (restarts itself)   or   ./a2kit mon receiver.bin → type it at the Monitor → 0800G</text>
</svg>
