MEMORY {
    RAM:  file = %O, start = $0E00, size = $0200, fill = yes, fillval = $00;
    RAM2: file = %O, start = $1000, size = $0080, fill = yes, fillval = $00;
    RAM3: file = %O, start = $1080, size = $0180, fill = yes, fillval = $00;
    RAM4: file = %O, start = $1200, size = $0100, fill = yes, fillval = $00;
    GAP:  file = %O, start = $1300, size = $0100, fill = yes, fillval = $00;
    RAM8: file = %O, start = $1400, size = $0200, fill = yes, fillval = $00;
    RAM5: file = %O, start = $1600, size = $0100, fill = yes, fillval = $00;
    RAM6: file = %O, start = $1700, size = $0100, fill = yes, fillval = $00;
    RAM7: file = %O, start = $1800, size = $0100;
}
SEGMENTS {
    CODE:   load = RAM,  type = ro;
    PLAYER: load = RAM2, type = ro;
    CODE2:  load = RAM3, type = ro;
    FAST:   load = RAM4, type = ro;
    FAST2:  load = RAM8, type = rw;
    FTAB:   load = RAM5, type = ro;
    FCODE:  load = RAM6, type = ro;
    FDISP:  load = RAM7, type = ro;
}
