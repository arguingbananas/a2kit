# Runs the whole test suite on every push to main and every pull request, on the
# oldest supported Python, the tested one and the two newer releases. No Apple II, serial port or network is
# needed: the tests use the 6502 simulator and pseudo-terminals (see CONTRIBUTING.md).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    # 24.04 is what the tested setup runs (Linux Mint 22), so cc65 is the same version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (pinned to a commit; Dependabot updates it)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: System tools (cc65, make, ffmpeg, shellcheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cc65 make ffmpeg shellcheck

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          # 3.12 gets the exact versions in constraints.txt; the others check the loose requirements,
          # except ruff, pinned everywhere so a new ruff release can't fail lint on its own
          if [ "${{ matrix.python }}" = "3.12" ]; then
            python -m pip install -r requirements-dev.txt -c constraints.txt
          else
            python -m pip install -r requirements-dev.txt "$(grep '^ruff==' constraints.txt)"
          fi
          python -m ruff --version

      - name: Doctor
        run: python tools/a2kit.py doctor

      - name: Lint
        run: make lint PYTHON=python

      - name: The committed 6502 programs and disks match their source
        run: |
          make clean
          make all PYTHON=python
          git diff --exit-code --stat -- '*.bin' '*.dsk' video.lbl

      - name: Test suite
        run: make test PYTHON=python
