name: Feature request
description: Suggest a new command, option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like a2kit to do?
      description: What you're trying to make or show on the Apple II, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ideas for how it could work
      description: Optional. Commands, options, or how it would look or sound on the Apple II.
  - type: input
    id: apple
    attributes:
      label: Apple II setup
      description: Optional, if it matters for this request.
      placeholder: e.g. Apple IIe 128K, Super Serial Card in slot 2
